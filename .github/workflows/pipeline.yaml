name: Test GitHub Token Clone

on:
  workflow_dispatch:

jobs:
  test-clone:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository using GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/nexusameer/Chat_Room.git
